<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        const targetUrl = "https://rhjohnstone.itch.io/";
        
        // Dynamically create and insert the meta refresh tag
        const meta = document.createElement('meta');
        meta.httpEquiv = "refresh";
        meta.content = "0; url=" + targetUrl;
        document.getElementsByTagName('head')[0].appendChild(meta);

        // Perform the immediate redirect
        window.location.replace(targetUrl);
    </script>
    <title>Redirecting...</title>
</head>
<body>
    <p>Redirecting to itch.io...</p>
</body>
</html>
